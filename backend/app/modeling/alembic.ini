# Alembic configuration for Data Modeling Center MVP.
# The database URL is read from application Settings (DATABASE_URL) inside
# migrations/env.py, so no connection string or secret lives in this file.

[alembic]
# script_location uses %(here)s so it resolves relative to this ini file rather
# than the process CWD: this package is mounted by the host app under /modeling
# and may be started from any working directory.
# Keep this file ASCII-only: alembic reads it with the locale codec (GBK on
# Windows), so any non-ASCII comment breaks startup.
script_location = %(here)s/migrations
# env.py imports backend.app.modeling.*, so the repository root must be on sys.path.
prepend_sys_path = %(here)s/../../..
version_path_separator = os
# prepend_sys_path uses %(here)s/../../..; declare the separator so alembic does
# not fall back to legacy splitting on spaces/commas/colons.
path_separator = os
# SQLite ALTER TABLE support is handled via render_as_batch in env.py.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
